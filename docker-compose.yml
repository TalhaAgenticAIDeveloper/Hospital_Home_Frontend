# ==============================================================================
# MedTrust SaaS Frontend - Docker Compose Configuration
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Production Service: Nginx serving optimized, cached production React build
  # Run with: docker compose up -d --build
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: healthcare_saas_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-5173}:80"
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frontend_network

  # ----------------------------------------------------------------------------
  # Development Service: Vite Dev Server with Live Code Hot-Reloading (HMR)
  # Run with: docker compose --profile dev up frontend-dev
  # ----------------------------------------------------------------------------
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: healthcare_saas_frontend_dev
    restart: unless-stopped
    profiles:
      - dev
    ports:
      - "${DEV_PORT:-5173}:5173"
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      # Mount source files for live hot module reloading (HMR)
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      # Prevent container node_modules from being overwritten by host
      - /app/node_modules
    networks:
      - frontend_network

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  frontend_network:
    name: healthcare_saas_frontend_network
    driver: bridge
