# ==============================================================================
# MedTrust SaaS Frontend - Nginx Configuration (SPA Routing & Caching)
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # Gzip Compression for Optimal Performance
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Healthcheck Endpoint (Used by Docker healthcheck)
    # --------------------------------------------------------------------------
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --------------------------------------------------------------------------
    # Immutable Static Assets (Vite produces content hashes in filenames)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # SPA Fallback for React Router
    # All routes that do not match physical files will return index.html
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --------------------------------------------------------------------------
    # Ignore Favicon & Robots Access Logs
    # --------------------------------------------------------------------------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Custom Error Pages
    # --------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
